
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RetailIQ - Login</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #101827, #243b55);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .container {
            width: 90%;
            max-width: 400px;
            background: #fff;
            color: #222;
            padding: 35px;
            border-radius: 16px;
            box-shadow: 0 10px 35px #0005;
        }
        h1 { text-align: center; color: #2563eb; }
        p { text-align: center; color: #666; }
        input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 7px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background: #1d4ed8; }
        .register { margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>RetailIQ</h1>
        <p>Online Retail Sales Analytics</p>

        <h2>Welcome Back</h2>

        <form id="loginForm">
            <input type="email" id="email"
                   placeholder="Email address" required>

            <input type="password" id="password"
                   placeholder="Password" required>

            <button type="submit">Login</button>
        </form>

        <p class="register">
            New user? <a href="#" id="registerLink">Register here</a>
        </p>
        <p id="message"></p>
    </div>

    <script>
        document.getElementById("loginForm")
        .addEventListener("submit", async function(e) {
            e.preventDefault();

            const response = await fetch("/api/login", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({
                    email: document.getElementById("email").value,
                    password: document.getElementById("password").value,
                    role: "user"
                })
            });

            const data = await response.json();
            document.getElementById("message").textContent =
                data.msg || "Login request completed";

            if (data.ok) {
                window.location.href = "/";
            }
        });

        document.getElementById("registerLink")
        .addEventListener("click", function(e) {
            e.preventDefault();
            document.getElementById("message").textContent =
                "Registration page needs to be configured.";
        });
    </script>
</body>
</html>
